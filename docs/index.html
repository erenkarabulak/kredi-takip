<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kredi Takip</title>
<style>
  /* ---------- AÇIK TEMA (varsayılan) ---------- */
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --line:#e3e6ea; --text:#1b1f24; --muted:#6b7480;
    --accent:#1d4ed8; --accent-soft:#e8efff;
    --ok:#0f7b46; --ok-soft:#e3f5eb;
    --warn:#a35c00; --warn-soft:#fdf0dc;
    --bad:#b3261e; --bad-soft:#fdeceb;
    --radius:10px;

    --panel-alt:#fafbfc;          /* ikincil yüzey: tablo başlığı, detay kutuları */
    --hover:#f0f2f5;              /* buton hover */
    --track:#eceef1;              /* ilerleme çubuğu, nötr rozet */
    --cell:#fcfcfd;               /* takvim hücresi */
    --cell-mut:#f6f7f9;           /* boş / hafta sonu hücre */
    --input-bg:#ffffff;
    --label:#39414b;
    --kenar-hover:#c4cbd4;
    --odm-yazi:#17307a;           /* takvimdeki ödeme etiketi yazısı */
    --accent-hover:#1a43b8;
    --danger-line:#f0cfcd;
    --on-accent:#ffffff;          /* accent zemin üzerindeki yazı */
    --perde:rgba(20,24,30,.45);
    --golge:rgba(0,0,0,.05);
    --golge-buyuk:rgba(0,0,0,.22);
    color-scheme: light;
  }

  /* ---------- KOYU TEMA ---------- */
  :root[data-tema="koyu"]{
    --bg:#0f1216; --panel:#181c22; --line:#2b323b; --text:#e5e9ee; --muted:#98a2ae;
    --accent:#6395f5; --accent-soft:#1b2942;
    --ok:#4ade80; --ok-soft:#123122;
    --warn:#fbbf24; --warn-soft:#332711;
    --bad:#f87171; --bad-soft:#3a1c1c;

    --panel-alt:#1e232a;
    --hover:#242a32;
    --track:#2b323b;
    --cell:#1b2027;
    --cell-mut:#161a20;
    --input-bg:#12161b;
    --label:#c2cad4;
    --kenar-hover:#3d4650;
    --odm-yazi:#bcd0f7;
    --accent-hover:#7aa5f7;
    --danger-line:#5c3030;
    --on-accent:#0f1216;
    --perde:rgba(0,0,0,.62);
    --golge:rgba(0,0,0,.35);
    --golge-buyuk:rgba(0,0,0,.55);
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  header{
    background:var(--panel); border-bottom:1px solid var(--line);
    padding:14px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    position:sticky; top:0; z-index:20;
  }
  header h1{font-size:17px; margin:0; font-weight:650; letter-spacing:-.2px}
  header .spacer{flex:1}
  .temaDugme{
    margin-left:auto; width:34px; height:34px; padding:0; border-radius:9px;
    display:inline-flex; align-items:center; justify-content:center; font-size:15px; line-height:1;
  }
  .wrap{max-width:1150px; margin:0 auto; padding:20px}

  button{
    font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--panel);
    color:var(--text); padding:7px 13px; border-radius:8px;
  }
  button:hover{background:var(--hover)}
  button.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600}
  button.primary:hover{background:var(--accent-hover)}
  button.ghost{border-color:transparent; background:transparent; color:var(--muted); padding:6px 9px}
  button.ghost:hover{background:var(--track); color:var(--text)}
  button.danger{color:var(--bad); border-color:var(--danger-line)}
  button.danger:hover{background:var(--bad-soft)}
  button:disabled{opacity:.45; cursor:not-allowed}

  /* ---------- özet ---------- */
  .ozet{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:22px}
  .kart{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px}
  .kart .etiket{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; font-weight:600}
  .kart .deger{font-size:23px; font-weight:650; margin-top:5px; letter-spacing:-.5px; font-variant-numeric:tabular-nums}
  .kart .alt{font-size:12.5px; color:var(--muted); margin-top:3px}
  .kart.vurgu-bad .deger{color:var(--bad)}
  .kart.vurgu-warn .deger{color:var(--warn)}
  .kart.vurgu-ok .deger{color:var(--ok)}

  h2.baslik{font-size:14px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin:26px 0 11px}

  /* ---------- kredi kartları ---------- */
  .krediler{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:13px}
  .kredi{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:15px 16px; cursor:pointer; transition:border-color .12s, box-shadow .12s;
  }
  .kredi:hover{border-color:var(--kenar-hover); box-shadow:0 1px 6px var(--golge)}
  .kredi.kapali{opacity:.62}
  .kredi .ust{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .kredi .banka{font-weight:650; font-size:15.5px}
  .kredi .aciklama{font-size:12.5px; color:var(--muted); margin-top:1px}
  .kredi .satir{display:flex; justify-content:space-between; font-size:13.5px; margin-top:9px}
  .kredi .satir span:last-child{font-weight:600; font-variant-numeric:tabular-nums}
  .bar{height:6px; background:var(--track); border-radius:99px; margin-top:12px; overflow:hidden}
  .bar > div{height:100%; background:var(--accent); border-radius:99px}
  .bar.bitti > div{background:var(--ok)}

  .rozet{
    display:inline-block; font-size:11.5px; font-weight:650; padding:2.5px 8px;
    border-radius:99px; white-space:nowrap;
  }
  .rozet.ok{background:var(--ok-soft); color:var(--ok)}
  .rozet.warn{background:var(--warn-soft); color:var(--warn)}
  .rozet.bad{background:var(--bad-soft); color:var(--bad)}
  .rozet.notr{background:var(--track); color:var(--muted)}

  /* ---------- tablo ---------- */
  .tabloKutu{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow-x:auto}
  table{border-collapse:collapse; width:100%; font-size:13.5px; min-width:640px}
  th,td{padding:9px 12px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap}
  th{font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); font-weight:650; background:var(--panel-alt)}
  tbody tr:last-child td{border-bottom:none}
  td.sayi, th.sayi{text-align:right; font-variant-numeric:tabular-nums}
  tr.odendi td{color:var(--muted)}
  tr.gecikmis td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
  tr.siradaki{background:var(--accent-soft)}

  /* ---------- form / modal ---------- */
  .perde{
    position:fixed; inset:0; background:var(--perde); display:flex;
    align-items:flex-start; justify-content:center; padding:34px 16px; overflow-y:auto; z-index:40;
  }
  .modal{
    background:var(--panel); border-radius:12px; width:100%; max-width:620px;
    box-shadow:0 12px 40px var(--golge-buyuk);
  }
  .modal.genis{max-width:900px}
  .modal .mbas{
    padding:16px 20px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:12px;
  }
  .modal .mbas h3{margin:0; font-size:16.5px; font-weight:650}
  .modal .mgovde{padding:20px}
  .modal .malt{padding:14px 20px; border-top:1px solid var(--line); display:flex; gap:9px; justify-content:flex-end}

  .alanlar{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  .alan{display:flex; flex-direction:column; gap:5px}
  .alan.tam{grid-column:1/-1}
  .alan label{font-size:12.5px; font-weight:600; color:var(--label)}
  .alan .ipucu{font-size:11.5px; color:var(--muted); font-weight:400; line-height:1.4}
  input,select{
    font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px;
    background:var(--input-bg); color:var(--text); width:100%;
  }
  input:focus,select:focus{outline:2px solid var(--accent-soft); border-color:var(--accent)}
  .onizleme{
    margin-top:16px; background:var(--panel-alt); border:1px solid var(--line); border-radius:8px;
    padding:12px 14px; font-size:13px;
  }
  .onizleme .sat{display:flex; justify-content:space-between; padding:3px 0}
  .onizleme .sat b{font-variant-numeric:tabular-nums}
  .hata{color:var(--bad); font-size:13px; margin-top:12px; min-height:18px}

  .bos{
    background:var(--panel); border:1px dashed var(--line); border-radius:var(--radius);
    padding:44px 20px; text-align:center; color:var(--muted);
  }
  .bos p{margin:0 0 14px}

  .detayUst{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:18px}
  .detayUst .k{background:var(--panel-alt); border:1px solid var(--line); border-radius:8px; padding:10px 12px}
  .detayUst .k .e{font-size:11.5px; color:var(--muted); font-weight:600}
  .detayUst .k .d{font-size:16px; font-weight:650; margin-top:2px; font-variant-numeric:tabular-nums}

  /* ---------- aylık takvim ---------- */
  .takvim{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:6px 4px}
  .tsat{display:grid; grid-template-columns:96px 1fr 118px; align-items:center; gap:10px; padding:4px 12px}
  .tsat:hover{background:var(--panel-alt)}
  .tsat .tay{font-size:13px; color:var(--muted)}
  .tsat .tay.yeniyil{font-weight:700; color:var(--text)}
  .tsat .tcubuk{background:var(--track); border-radius:4px; height:19px; position:relative; overflow:hidden}
  .tsat .tcubuk > div{height:100%; background:var(--accent); border-radius:4px; opacity:.82}
  .tsat .tcubuk.zirve > div{background:var(--bad)}
  .tsat .tcubuk.odendi > div{background:var(--ok)}
  .tsat .ttutar{text-align:right; font-size:13px; font-weight:600; font-variant-numeric:tabular-nums}
  .tsat.gecmis .tay, .tsat.gecmis .ttutar{color:var(--muted); font-weight:400}
  .takvimAlt{display:flex; gap:18px; flex-wrap:wrap; padding:10px 14px 6px; border-top:1px solid var(--line);
             margin-top:6px; font-size:12.5px; color:var(--muted)}

  /* ---------- takvim ızgarası ---------- */
  .izgaraKutu{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px}
  .izgaraBas{display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap}
  .izgaraBas .ay{font-size:16px; font-weight:650; min-width:150px}
  .izgaraBas .top{margin-left:auto; font-size:13.5px; color:var(--muted)}
  .izgaraBas .top b{color:var(--text); font-variant-numeric:tabular-nums}
  .izgara{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
  .izgara .gunBas{font-size:11px; font-weight:650; color:var(--muted); text-align:center;
                  text-transform:uppercase; letter-spacing:.4px; padding:2px 0 4px}
  .hucre{min-height:74px; border:1px solid var(--line); border-radius:7px; padding:4px 5px;
         background:var(--cell); display:flex; flex-direction:column; gap:3px}
  .hucre.bos{background:var(--cell-mut); border-style:dashed; opacity:.5}
  .hucre.haftasonu{background:var(--cell-mut)}
  .hucre.bugun{border-color:var(--accent); border-width:2px; padding:3px 4px}
  .hucre .no{font-size:11.5px; color:var(--muted); font-weight:600; line-height:1}
  .hucre.bugun .no{color:var(--accent); font-weight:700}
  .odm{font-size:10.5px; line-height:1.25; border-radius:4px; padding:2px 4px; cursor:pointer;
       background:var(--accent-soft); color:var(--odm-yazi); border:1px solid transparent}
  .odm:hover{border-color:var(--accent)}
  .odm b{display:block; font-variant-numeric:tabular-nums; font-size:11px}
  .odm.odendi{background:var(--ok-soft); color:var(--ok)}
  .odm.gecikmis{background:var(--bad-soft); color:var(--bad)}
  .odm .kaydi{opacity:.75; font-size:9.5px}
  .izgaraAlt{display:flex; gap:16px; flex-wrap:wrap; margin-top:12px; padding-top:10px;
             border-top:1px solid var(--line); font-size:12px; color:var(--muted)}
  .izgaraAlt span{display:flex; align-items:center; gap:5px}
  .izgaraAlt i{width:11px; height:11px; border-radius:3px; display:inline-block}
  @media (max-width:640px){
    .hucre{min-height:56px; padding:3px}
    .odm{font-size:9.5px}
    .odm b{font-size:10px}
    .izgara{gap:3px}
  }

  /* ---------- detay bilgi listesi ---------- */
  .bilgiler{border:1px solid var(--line); border-radius:8px; overflow:hidden; margin-bottom:18px}
  .bilgiler .b{display:grid; grid-template-columns:210px 1fr; gap:12px; padding:7px 13px; font-size:13px;
               border-bottom:1px solid var(--line)}
  .bilgiler .b:last-child{border-bottom:none}
  .bilgiler .b:nth-child(odd){background:var(--panel-alt)}
  .bilgiler .b .e{color:var(--muted); font-weight:600}
  @media (max-width:560px){
    .bilgiler .b{grid-template-columns:1fr; gap:1px}
    .tsat{grid-template-columns:74px 1fr 100px; gap:7px}
  }

  input[type=checkbox]{width:16px; height:16px; cursor:pointer; accent-color:var(--accent)}

  @media (max-width:560px){
    .alanlar{grid-template-columns:1fr}
    .wrap{padding:14px}
    header{padding:12px 14px}
  }

  /* ---------- parola ekranı ---------- */
  .parolaEkrani{
    position:fixed; inset:0; background:var(--bg); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .parolaKutu{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:28px 26px; width:100%; max-width:360px; box-shadow:0 12px 40px var(--golge-buyuk);
  }
  .parolaKutu h2{margin:0 0 6px; font-size:18px; font-weight:650}
  .parolaKutu p{margin:0 0 18px; font-size:13.5px; color:var(--muted); line-height:1.5}
  .parolaKutu input{margin-bottom:12px}
  .parolaKutu button{width:100%; padding:10px}
  .parolaHata{color:var(--bad); font-size:13px; margin-top:10px; min-height:18px}
</style>
<script>
// Tema, sayfa çizilmeden ÖNCE uygulanmalı; yoksa koyu modda bir an beyaz parlar.
(function(){
  try{
    var kayitli = localStorage.getItem("kredi-takip-tema");
    var sistem = window.matchMedia("(prefers-color-scheme: dark)").matches ? "koyu" : "acik";
    document.documentElement.setAttribute("data-tema", kayitli || sistem);
  }catch(e){
    document.documentElement.setAttribute("data-tema", "acik");
  }
})();
</script>
</head>
<body>

<div class="parolaEkrani" id="parolaEkrani">
  <div class="parolaKutu">
    <h2>Kredi Takip</h2>
    <p>Bu sayfanın içeriği şifreli. Devam etmek için parolayı gir.</p>
    <input type="password" id="parolaGirdi" placeholder="Parola" autocomplete="current-password">
    <button class="primary" id="parolaDugme" onclick="parolaDene()">Görüntüle</button>
    <div class="parolaHata" id="parolaHata"></div>
  </div>
</div>

<div id="uygulamaIcerik" style="display:none">

<header>
  <h1>Kredi Takip</h1>
  <span id="hBilgi" class="rozet notr"></span>
  <button class="temaDugme" id="temaDugme" onclick="temaDegistir()"></button>
</header>

<div class="wrap">
  <div class="ozet" id="ozet"></div>

  <h2 class="baslik">Ödeme takvimi</h2>
  <div id="izgara"></div>

  <h2 class="baslik">Yaklaşan ödemeler · 30 gün</h2>
  <div id="yaklasan"></div>

  <h2 class="baslik">Krediler</h2>
  <div id="krediler"></div>

  <h2 class="baslik">Kredili mevduat / Artı Para</h2>
  <div id="kmh"></div>

  <h2 class="baslik">Gelen / giden — kişiler</h2>
  <div id="cari"></div>

  <h2 class="baslik" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    Erken kapatma senaryosu
    <span style="text-transform:none;letter-spacing:0;font-weight:400;font-size:13px;
                 display:flex;align-items:center;gap:7px">
      hesap tarihi
      <input type="date" id="kapamaTarih" onchange="kapamaCiz()"
             style="width:auto;padding:4px 8px;font-size:13px">
    </span>
    <label style="text-transform:none;letter-spacing:0;font-weight:400;font-size:13px;
                  display:flex;align-items:center;gap:6px;cursor:pointer">
      <input type="checkbox" id="kapamaOto" checked onchange="kapamaCiz()">
      vadesi geçen taksitler otomatik ödendi sayılsın
    </label>
  </h2>
  <div id="kapama"></div>

  <h2 class="baslik">Aylık yük dağılımı</h2>
  <div id="takvim"></div>
</div>

<div id="modalYuva"></div>
</div><!-- /uygulamaIcerik -->

const TL = new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",maximumFractionDigits:2});
const TL0 = new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",maximumFractionDigits:0});
const para  = n => TL.format(n || 0);
const para0 = n => TL0.format(n || 0);

function bugun(){
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function tarihe(s){
  // "YYYY-AA-GG" -> yerel Date (saat dilimi kaymasını önlemek için elle parçala)
  const [y,a,g] = s.split("-").map(Number);
  return new Date(y, a-1, g);
}
function metne(d){
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}
function gosterTarih(s){
  if(!s) return "—";
  return tarihe(s).toLocaleDateString("tr-TR",{day:"2-digit",month:"short",year:"numeric"});
}
function ayEkle(tarihStr, ay){
  // Ay sonu taşmasını engelle: 31 Ocak + 1 ay = 28/29 Şubat
  const d = tarihe(tarihStr);
  const gun = d.getDate();
  const h = new Date(d.getFullYear(), d.getMonth() + ay, 1);
  const sonGun = new Date(h.getFullYear(), h.getMonth()+1, 0).getDate();
  h.setDate(Math.min(gun, sonGun));
  return metne(h);
}
function gunFarki(a, b){
  return Math.round((tarihe(a) - b) / 86400000);
}
// Vade hafta sonuna denk gelirse tahsilat bir sonraki iş gününde olur.
// Gecikme hesabı bu efektif tarihe göre yapılır, yoksa yanlış "geciken" uyarısı çıkar.
// Not: resmi tatiller hesaba katılmaz, sadece cumartesi/pazar.
function isGunune(s){
  const d = tarihe(s);
  const g = d.getDay();               // 0 pazar, 6 cumartesi
  if(g === 0)      d.setDate(d.getDate() + 1);
  else if(g === 6) d.setDate(d.getDate() + 2);
  return metne(d);
}
function haftaSonu(s){
  const g = tarihe(s).getDay();
  return g === 0 || g === 6;
}
function kacir(s){
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function yeniId(){
  return "k" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}
// Aynı bankada birden çok kredi var — hesap/kredi numarası olmadan satırlar
// birbirine karışıyor. Açıklamanın ilk parçası ("Hesap ...", "Kredi ...",
// "Müşteri ...") tam da bu ayırt edici bilgidir.
// Buraya gerçek hesap numarası ÖRNEK olarak bile yazma: bu yorum şifrelenmeyen
// kabuk HTML'inde kalır, yayin_uret.py sızıntı denetimini haklı olarak patlatır.
function hesapAdi(k){
  const ilk = String(k.aciklama || "").split("·")[0].trim();
  return ilk || k.kisaAd || "";
}

/* ============================================================
   TAKSİT PLANI
   Anüite (eşit taksit): T = P·i / (1 - (1+i)^-n),  i = aylık faiz oranı
   Faiz oranı 0 ise taksit = P/n.
   Kullanıcı sözleşmedeki gerçek taksiti elle girdiyse o kullanılır
   (vergi/masraf dahil olabileceği için banka taksiti hesaptan sapar).
   Son taksitte yuvarlama farkı kapatılır; kalan anapara tam 0'a iner.
   ============================================================ */
function taksitHesapla(anapara, faizAylikYuzde, vade){
  const i = (faizAylikYuzde || 0) / 100;
  if(vade <= 0) return 0;
  if(i === 0) return anapara / vade;
  return anapara * i / (1 - Math.pow(1 + i, -vade));
}

// Taksitin bir kısmı ödendiyse (ör. kart taksitinin bir bölümü) ödenen ve kalan
// tutar taksitin üzerinde durur. Tamamı ödenen taksitte kalan 0'dır.
function kismiEkle(k, t){
  const liste = (k.kismiOdemeler && k.kismiOdemeler[t.no]) || [];
  t.kismiListe = liste;
  t.kismi = t.odendi ? 0 : liste.reduce((s, x) => s + x.tutar, 0);
  t.kalan = t.odendi ? 0 : t.tutar - t.kismi;
  return t;
}

function planUret(k){
  // Bankanın kendi ödeme planı satır satır girildiyse hesaplama yapma, olduğu gibi kullan.
  // Taksitler eşit olmayabilir (faiz gerçek ödeme günlerine göre işler), fon/BSMV ayrı durur.
  if(Array.isArray(k.ozelPlan) && k.ozelPlan.length){
    return k.ozelPlan.map((s, idx) => ({
      no: idx + 1,
      vade: s.vade,
      odemeVade: isGunune(s.vade),
      tutar: s.tutar,
      anapara: s.anapara,
      faiz: s.faiz || 0,
      fon: s.fon || 0,
      vergi: s.vergi || 0,
      kalanAnapara: s.kalanAnapara,
      devir: s.devir || null, devirGelen: s.devirGelen || null, tahmini: s.tahmini || null,
      odendi: !!(k.odemeler && k.odemeler[idx + 1]),
      odemeTarihi: (k.odemeler && k.odemeler[idx + 1]) || null
    })).map(t => kismiEkle(k, t));
  }

  const i = (k.faizAylik || 0) / 100;
  const taksit = k.taksitTutar || taksitHesapla(k.anapara, k.faizAylik, k.vade);
  const plan = [];
  let kalan = k.anapara;

  for(let n = 1; n <= k.vade; n++){
    const faiz = kalan * i;
    let anaparaPay = taksit - faiz;
    let odenecek = taksit;

    if(n === k.vade){
      // Son taksit: kalan anaparayı tam kapat
      anaparaPay = kalan;
      odenecek = kalan + faiz;
    }
    if(anaparaPay > kalan){        // taksit kalandan büyükse erken kapanır
      anaparaPay = kalan;
      odenecek = kalan + faiz;
    }
    kalan = Math.max(0, kalan - anaparaPay);

    plan.push({
      no: n,
      vade: ayEkle(k.ilkTaksit, n - 1),
      odemeVade: isGunune(ayEkle(k.ilkTaksit, n - 1)),
      tutar: odenecek,
      faiz: faiz,
      anapara: anaparaPay,
      kalanAnapara: kalan,
      odendi: !!(k.odemeler && k.odemeler[n]),
      odemeTarihi: (k.odemeler && k.odemeler[n]) || null
    });
    kismiEkle(k, plan[plan.length - 1]);

    if(kalan <= 0.005) break;      // borç bittiyse kalan taksitleri üretme
  }
  return plan;
}

function krediOzet(k){
  const plan = planUret(k);
  const bg = bugun();
  let odenen = 0, kalanBorc = 0, gecikmis = 0, gecikmisAdet = 0, odenenAdet = 0;
  let odenenAnapara = 0, odenenMaliyet = 0, kalanAnaparaBorc = 0, kalanMaliyet = 0;
  let siradaki = null;

  for(const t of plan){
    const maliyet = t.faiz + (t.fon || 0) + (t.vergi || 0);   // faiz + KKDF + BSMV
    if(t.odendi){
      odenen += t.tutar; odenenAdet++;
      odenenAnapara += t.anapara; odenenMaliyet += maliyet;
    }else{
      // Kısmi ödeme önce anaparadan düşülür (faizsiz kart taksitlerinde zaten tamamı anapara)
      odenen += t.kismi; odenenAnapara += t.kismi;
      kalanBorc += t.kalan;
      kalanAnaparaBorc += t.anapara - t.kismi; kalanMaliyet += maliyet;
      if(!siradaki) siradaki = t;
      if(gunFarki(t.odemeVade, bg) < 0){ gecikmis += t.kalan; gecikmisAdet++; }
    }
  }
  const kalanAnapara = siradaki
    ? plan[siradaki.no - 1 - 1]?.kalanAnapara ?? k.anapara   // sıradakinden önceki taksitin kalanı
    : 0;

  return {
    plan, odenen, kalanBorc, gecikmis, gecikmisAdet, odenenAdet,
    siradaki, kalanAnapara,
    odenenAnapara, odenenMaliyet, kalanAnaparaBorc, kalanMaliyet,
    toplamGeriOdeme: plan.reduce((s,t) => s + t.tutar, 0),
    toplamAnapara:   plan.reduce((s,t) => s + t.anapara, 0),
    toplamMaliyet:   plan.reduce((s,t) => s + t.faiz + (t.fon||0) + (t.vergi||0), 0),
    taksitSayisi: plan.length,
    bitti: !siradaki
  };
}

    <div class="kart">
      <div class="etiket">Taksitli kredi borcu</div>

      <div class="alt">${aktifKredi} kredi · ${kalanTaksitT} taksit kaldı</div>
    </div>
    ${kmhHesaplari.length ? `
    <div class="kart">
      <div class="etiket">Kredili mevduat borcu</div>
      <div class="deger">${para0(kmhToplam)}</div>
      <div class="alt">${kmhHesaplari.length} hesap · vadesiz, döner bakiye</div>
    </div>` : ""}
    <div class="kart ${buAy > 0 ? "vurgu-warn" : ""}">
      <div class="etiket">${kacir(ayAdi)} ayında ödenecek</div>
      <div class="deger">${para0(buAy)}</div>

/* ============================================================
   ERKEN KAPATMA

   Formül, Garanti'nin iki ödeme planındaki "Bugünkü Kredi Borcu"
   rakamına karşı doğrulandı ve her ikisini de kuruşuna kadar tutturdu:

     kapama = kalan_anapara + kalan_anapara × (aylık_oran/100) × (gün/30) × 1,30

   gün  : son ödenen taksitin VADESİNDEN hesap tarihine kadar
          (ödeme tarihinden değil — 703'te bu ayrım 220 TL fark yaratıyordu)
   1,30 : KKDF %15 + BSMV %15, faiz üzerinden

   Hiç taksit ödenmemişse başlangıç noktası kredinin kullandırım tarihidir.

   DAHİL DEĞİL: erken ödeme tazminatı. Mevzuata göre kalan vadesi 36 ayı
   aşmayan tüketici kredilerinde erken ödenen anaparanın %1'i kadar tazminat
   istenebilir. Bankanın vereceği rakam bu kadar yukarıda çıkabilir.
   ============================================================ */
const VERGI_CARPANI = 1.30;          // KKDF %15 + BSMV %15

// Taksitler bankada otomatik ödemeye bağlı. Elle işaretlenmemiş ama vadesi
// geçmiş taksitleri ödenmiş saymazsak, aradan geçen her gün için faiz işletmeye
// devam eder ve bakiye bankanınkinden yukarı sapar.
function erkenKapama(k, hesapTarihi, otomatikVarsay){
  const plan = planUret(k);
  const oran = (k.faizAylik || 0) / 100;
  const h = tarihe(hesapTarihi);

  // Hesap tarihinde fiilen ödenmiş olan son taksit. Geçmiş bir tarih için
  // hesap yapılırken o tarihten sonraki ödemeler sayılmamalı.
  let sonOdenen = null, varsayilan = 0;
  for(const t of plan){
    if(t.odendi){
      if(!t.odemeTarihi || tarihe(t.odemeTarihi) <= h) sonOdenen = t;
    }else if(otomatikVarsay && !t.kismi && tarihe(t.odemeVade) <= h){
      sonOdenen = t; varsayilan++;
    }
  }

  let anapara, baslangic, dayanak, kesin = true;
  if(sonOdenen){
    anapara   = sonOdenen.kalanAnapara;
    baslangic = sonOdenen.vade;
    dayanak   = `${sonOdenen.no}. taksit vadesi`;
  }else if(k.kullandirim){
    anapara   = k.anapara;
    baslangic = k.kullandirim;
    kesin     = !!k.kullandirimKesin;
    dayanak   = "kullandırım tarihi";
  }else{
    return null;                     // hesaplanamaz
  }

  // Hesap tarihine kadar yapılmış kısmi ödemeler kalan anaparadan düşer.
  const kalanNo0 = sonOdenen ? sonOdenen.no : 0;
  for(const t of plan){
    if(t.no <= kalanNo0 || t.odendi) continue;
    for(const x of (t.kismiListe || [])) if(tarihe(x.tarih) <= h) anapara -= x.tutar;
  }

  // Taksit vadesinden önce ödendiyse gün negatif çıkar — faiz işlemez, sıfırlanır.
  const gun = Math.max(0, gunFarki(hesapTarihi, tarihe(baslangic)));

  const faiz  = anapara * oran * (gun / 30);
  const vergi = faiz * (VERGI_CARPANI - 1);
  let tutar = anapara + faiz + vergi;

  // Bankadan alınan gerçek bakiye varsa ve aynı tarihe aitse tahmini o ezer.
  const t = k.kapamaTeyit;
  const teyitli = !!(t && t.tarih === hesapTarihi);
  const sapma = teyitli ? tutar - t.tutar : null;   // sadece aynı tarihte anlamlı
  if(teyitli) tutar = t.tutar;

  // Taksitle devam edilirse bundan sonra ödenecek toplam
  const kalanNo = sonOdenen ? sonOdenen.no : 0;
  const taksitli = plan.filter(t => t.no > kalanNo).reduce((s, t) => s + (t.odendi ? t.tutar : t.kalan), 0);

  return {
    anapara, gun, baslangic, dayanak, kesin, varsayilan,
    faiz, vergi, tutar,
    teyitli, teyit: t, sapma,
    taksitli,
    kazanc: taksitli - tutar
  };
}

              </div></td>

          <tr style="background:var(--panel-alt)">

          </tr>

        taksitle ödeyeceğin <b>${para(tTaksitli)}</b> yerine —
        <b style="color:var(--ok)">${para(tKazanc)}</b> faizden kurtulursun.
      </p>
      <p style="margin:${toplamVarsayilan ? "6px 0 0" : "0"};color:var(--warn)">
        ${toplamVarsayilan
          ? `Şu an ${toplamVarsayilan} taksit "otomatik ödendi" varsayılıyor. Bir taksit
             gerçekten ödenmediyse üstteki kutunun işaretini kaldır.`
          : ""}
      </p>
    </div>`;
}

/* ============================================================
   ÖDEME TAKVİMİ — ay ızgarası
   Hangi gün hangi krediye ne ödeneceğini gün gün gösterir.
   Vade hafta sonuna denk geldiğinde tahsilatın kaydığı gün de belirtilir.
   ============================================================ */
let izgaraAy = null;                       // "YYYY-AA"

function izgaraKaydir(fark){
  const [y, a] = izgaraAy.split("-").map(Number);
  const d = new Date(y, a - 1 + fark, 1);
  izgaraAy = metne(d).slice(0, 7);
  izgaraCiz();
}
function izgaraBugun(){
  izgaraAy = metne(bugun()).slice(0, 7);
  izgaraCiz();
}

function izgaraCiz(){
  const kutu = document.getElementById("izgara");
  const bg = bugun();
  if(!izgaraAy) izgaraAy = metne(bg).slice(0, 7);

  const [yil, ayNo] = izgaraAy.split("-").map(Number);
  const ilkGun  = new Date(yil, ayNo - 1, 1);
  const gunSayisi = new Date(yil, ayNo, 0).getDate();
  const oncekiBos = (ilkGun.getDay() + 6) % 7;      // pazartesi = 0

  // Ayın ödemelerini güne göre topla
  const gunler = {};
  let ayToplam = 0, ayOdenen = 0;
  for(const k of veri.krediler){
    for(const t of planUret(k)){
      if(t.vade.slice(0, 7) !== izgaraAy) continue;
      const g = +t.vade.slice(8, 10);
      (gunler[g] = gunler[g] || []).push({k, t});
      if(t.odendi) ayOdenen += t.tutar; else { ayOdenen += t.kismi; ayToplam += t.kalan; }
    }
  }

  const ayAdi = ilkGun.toLocaleDateString("tr-TR", {month:"long", year:"numeric"});
  const GUNLER = ["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"];
  let hucreler = "";

  for(let i = 0; i < oncekiBos; i++) hucreler += `<div class="hucre bos"></div>`;

  for(let g = 1; g <= gunSayisi; g++){
    const tarihStr = `${yil}-${String(ayNo).padStart(2,"0")}-${String(g).padStart(2,"0")}`;
    const d = new Date(yil, ayNo - 1, g);
    const hs = d.getDay() === 0 || d.getDay() === 6;
    const bugunMu = tarihStr === metne(bg);
    const liste = gunler[g] || [];

    hucreler += `<div class="hucre ${hs ? "haftasonu" : ""} ${bugunMu ? "bugun" : ""}">
      <div class="no">${g}</div>
      ${liste.map(({k, t}) => {
        const gecikmis = !t.odendi && gunFarki(t.odemeVade, bg) < 0;
        const kaydi = t.odemeVade !== t.vade;
        return `<div class="odm ${t.odendi ? "odendi" : ""} ${gecikmis ? "gecikmis" : ""}"
             onclick="detayAc('${k.id}')"
             title="${kacir(k.banka + " · " + k.aciklama)} — ${t.no}. taksit">
          ${kacir(k.kisaAd || k.banka)}
          <b>${para0(t.odendi ? t.tutar : t.kalan)}</b>
          ${t.odendi ? `<span class="kaydi">ödendi</span>`
            : kaydi ? `<span class="kaydi">→ ${gosterTarih(t.odemeVade).slice(0, 6)}</span>` : ""}
        </div>`;
      }).join("")}
    </div>`;
  }

  kutu.innerHTML = `<div class="izgaraKutu">
    <div class="izgaraBas">
      <button onclick="izgaraKaydir(-1)" title="Önceki ay">‹</button>
      <div class="ay">${kacir(ayAdi)}</div>
      <button onclick="izgaraKaydir(1)" title="Sonraki ay">›</button>
      <button class="ghost" onclick="izgaraBugun()">Bugün</button>
      <div class="top">
        ${ayToplam > 0 ? `bu ay ödenecek <b>${para(ayToplam)}</b>` : "bu ay ödenecek taksit yok"}
        ${ayOdenen > 0 ? ` · ödenen <b style="color:var(--ok)">${para(ayOdenen)}</b>` : ""}
      </div>
    </div>
    <div class="izgara">
      ${GUNLER.map(g => `<div class="gunBas">${g}</div>`).join("")}
      ${hucreler}
    </div>
    <div class="izgaraAlt">
      <span><i style="background:var(--accent-soft);border:1px solid var(--accent)"></i> ödenecek</span>
      <span><i style="background:var(--ok-soft);border:1px solid var(--ok)"></i> ödendi</span>
      <span><i style="background:var(--bad-soft);border:1px solid var(--bad)"></i> geciken</span>
      <span>“→” işareti, vade hafta sonuna denk geldiği için tahsilatın kaydığı günü gösterir</span>
    </div>
  </div>`;
}

/* ============================================================
   AYLIK YÜK DAĞILIMI
   Ödenmemiş taksitleri aya göre toplar; nakit planlaması için
   hangi ayın ne kadar yük getirdiğini gösterir.
   ============================================================ */
function takvimCiz(){
  const bg = bugun();
  const aylar = new Map();          // "YYYY-AA" -> {tutar, adet, odendi}

  for(const k of veri.krediler){
    for(const t of planUret(k)){
      const ay = t.vade.slice(0, 7);
      if(!aylar.has(ay)) aylar.set(ay, {tutar:0, adet:0, odenen:0});
      const a = aylar.get(ay);
      a.adet++;
      if(t.odendi) a.odenen += t.tutar;
      else { a.odenen += t.kismi; a.tutar += t.kalan; }
    }
  }

  const kutu = document.getElementById("takvim");
  if(aylar.size === 0){ kutu.innerHTML = ""; return; }

  const sirali = [...aylar.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1);
  const enBuyuk = Math.max(...sirali.map(([, a]) => a.tutar + a.odenen));
  const kalanTop = sirali.reduce((s, [, a]) => s + a.tutar, 0);
  const buAy = metne(bg).slice(0, 7);

  // Önümüzdeki 12 ayın yükü
  let gelecek12 = 0;
  for(const [ay, a] of sirali){
    if(ay >= buAy && ay < metne(new Date(bg.getFullYear() + 1, bg.getMonth(), 1)).slice(0, 7))
      gelecek12 += a.tutar;
  }
  const zirve = Math.max(...sirali.filter(([ay]) => ay >= buAy).map(([, a]) => a.tutar));

  kutu.innerHTML = `<div class="takvim">
    ${sirali.map(([ay, a]) => {
      const [yil, no] = ay.split("-");
      const d = new Date(+yil, +no - 1, 1);
      const etiket = d.toLocaleDateString("tr-TR", {month:"long", year:"numeric"});
      const gecmis = ay < buAy;
      const tam = a.tutar + a.odenen;
      const genislik = enBuyuk > 0 ? (tam / enBuyuk * 100) : 0;
      const hepOdendi = a.tutar === 0 && a.odenen > 0;
      return `<div class="tsat ${gecmis || hepOdendi ? "gecmis" : ""}">
        <div class="tay ${no === "01" ? "yeniyil" : ""}">${kacir(etiket)}</div>
        <div class="tcubuk ${hepOdendi ? "odendi" : (a.tutar === zirve && zirve > 0 ? "zirve" : "")}">
          <div style="width:${genislik}%"></div>
        </div>
        <div class="ttutar">${hepOdendi
          ? `<span style="color:var(--ok)">ödendi</span>`
          : para0(a.tutar)}</div>
      </div>`;
    }).join("")}
    <div class="takvimAlt">
      <span>Önümüzdeki 12 ay: <b style="color:var(--text)">${para0(gelecek12)}</b>
        (aylık ort. ${para0(gelecek12 / 12)})</span>
      <span>En ağır ay: <b style="color:var(--bad)">${para0(zirve)}</b></span>
      <span>Toplam kalan: <b style="color:var(--text)">${para0(kalanTop)}</b></span>
    </div>
  </div>`;
}

/* ============================================================
   YAKLAŞAN ÖDEMELER (geciken + önümüzdeki 30 gün)
   ============================================================ */
function yaklasanCiz(){
  const bg = bugun();
  const sinir = 30;            // bugünden itibaren en fazla bir ay (geciken taksitler her zaman görünür)
  const satirlar = [];

  for(const k of veri.krediler){
    for(const t of planUret(k)){
      if(t.odendi) continue;
      const fark = gunFarki(t.odemeVade, bg);
      if(fark <= sinir) satirlar.push({k, t, fark});
    }
  }

  // Kredili mevduat hesaplarının ekstre son ödeme tarihleri de burada görünmeli;
  // taksit değil ama vadesi olan bir yükümlülük (asgari ödeme).
  for(const h of (veri.kmh || [])){
    const sonOdeme = h.sonOdemeTarihi || h.ekstreOzeti?.sonOdemeTarihi;
    if(!sonOdeme) continue;
    const fark = gunFarki(sonOdeme, bg);
    if(fark < 0 || fark > sinir) continue;      // geçmiş dönem ekstresini gösterme
    satirlar.push({
      kmh: h, fark, vade: sonOdeme,
      asgari: h.ekstreOzeti?.minimumOdeme ?? null,
    });
  }

  satirlar.sort((a,b) => a.fark - b.fark);

  const kutu = document.getElementById("yaklasan");
  if(satirlar.length === 0){
    kutu.innerHTML = `<div class="bos"><p>Önümüzdeki ${sinir} gün içinde ödeme yok.</p></div>`;
    return;
  }

  kutu.innerHTML = `<div class="tabloKutu"><table>
    <thead><tr>
      <th>Vade</th><th>Durum</th><th>Banka</th><th>Taksit</th>
      <th class="sayi">Tutar</th>
    </tr></thead>
    <tbody>${satirlar.slice(0,25).map(s => {
      const fark = s.fark;
      let rozet;
      if(fark < 0)       rozet = `<span class="rozet bad">${-fark} gün gecikti</span>`;
      else if(fark === 0)rozet = `<span class="rozet bad">Bugün</span>`;
      else if(fark <= 7) rozet = `<span class="rozet warn">${fark} gün kaldı</span>`;
      else               rozet = `<span class="rozet notr">${fark} gün kaldı</span>`;

      // Kredili mevduat ekstresi — taksit değil, ekstre son ödeme günü
      if(s.kmh){
        const h = s.kmh;
        return `<tr class="${fark < 0 ? "gecikmis" : ""}">
          <td>${gosterTarih(s.vade)}</td>
          <td>${rozet}</td>
          <td><b>${kacir(h.banka)}</b> · ${kacir(h.urun || "Kredili mevduat")}</td>
          <td style="color:var(--muted)">ekstre</td>
          <td class="sayi">${s.asgari != null
            ? `<b>${para(s.asgari)}</b><div style="font-size:11.5px;color:var(--muted)">asgari · borç ${para0(h.bakiye)}</div>`
            : `<span style="color:var(--muted)">borç ${para0(h.bakiye)}</span>`}</td>
        </tr>`;
      }

      const {k, t} = s;
      return `<tr class="${fark < 0 ? "gecikmis" : ""}">
        <td>${gosterTarih(t.vade)}${haftaSonu(t.vade)
              ? `<div style="font-size:11.5px;color:var(--muted)">hafta sonu → ${gosterTarih(t.odemeVade)}</div>` : ""}</td>
        <td>${rozet}</td>
        <td><b>${kacir(k.banka)}</b>${k.aciklama ? " · " + kacir(k.aciklama) : ""}</td>
        <td>${t.no}/${k.vade}</td>
        <td class="sayi"><b>${para(t.kalan)}</b>${t.kismi
          ? `<div style="font-size:11.5px;color:var(--muted)">${para0(t.kismi)} ödendi · taksit ${para0(t.tutar)}</div>` : ""}</td>
      </tr>`;
    }).join("")}</tbody></table></div>`;
}

  }).join("")}</div>`;

/* ============================================================
   KREDİLİ MEVDUAT / ARTI PARA

   Taksitli kredilerden temelden farklı: sabit bir ödeme planı yok,
   döner bir bakiye var. Garanti'nin ekstresi bunun ötesinde bir gerçek
   gösterdi: hesap sürekli para giriş/çıkışı olan İŞLEMSEL bir hesap
   (maaş, kart borcu, transferler). Yani bakiye faizden çok gerçek nakit
   hareketleriyle değişiyor — günlük "faiz işleterek büyütme" tahmini
   burada YANILTICI olur, bir sonraki gün bakiye faiz yüzünden değil
   yeni bir işlem yüzünden değişebilir.

   Bu yüzden büyüme PROJEKSİYONU yapmıyoruz. Sadece son bilinen bakiyeyi
   ve tarihini gösteriyoruz; kullanıcı güncelledikçe biz de güncelliyoruz.
   ============================================================ */
function kmhCiz(){
  const kutu = document.getElementById("kmh");
  const hesaplar = veri.kmh || [];
  if(hesaplar.length === 0){ kutu.innerHTML = ""; return; }

  const bg = bugun();
  let toplamBakiye = 0, toplamGunluk = 0;

  kutu.innerHTML = `<div class="krediler">${hesaplar.map(h => {
    toplamBakiye += h.bakiye;
    const gun = Math.max(0, gunFarki(h.tarih, bg));
    const limitVar = h.limit != null;
    const e = h.ekstreOzeti;
    // Faiz kredilerdeki formülün aynısıyla işliyor: bakiye × aylık oran × gün/30 × 1,30.
    // Garanti ekranı bunu doğruladı (vergi/faiz = tam 0,30, faiz tutarı tam 1 günlük).
    // Kesim ayın son günü yapılıyor, o yüzden projeksiyon ay sonuna kadar.
    // Taban, birikmiş faizi İÇERMEYEN anapara olmalı; bakiye üzerinden hesaplamak
    // faizin faizini bir gün erken saydırıp bankanın rakamından birkaç kuruş sapıyor.
    const faizTabani = h.kullanilanAnapara != null ? h.kullanilanAnapara : h.bakiye;
    const gunlukFaiz = faizTabani * (h.faizAylik || 0) / 100 / 30 * 1.30;
    const ayinSonGunu = new Date(bg.getFullYear(), bg.getMonth() + 1, 0).getDate();
    const kalanGun = ayinSonGunu - bg.getDate() + 1;
    toplamGunluk += gunlukFaiz;
    return `<div class="kredi" style="cursor:default">
      <div class="ust">
        <div>
          <div class="banka">${kacir(h.banka)}</div>
          <div class="aciklama">${kacir(h.urun || "Kredili mevduat")}</div>
        </div>
      </div>
      <div class="satir"><span>Son bilinen bakiye</span><span>${para(h.bakiye)}</span></div>
      ${h.hesapBakiyesi != null ? `<div class="satir"><span>Vadesiz hesap bakiyesi</span>
        <span style="color:var(--ok)">+${para(h.hesapBakiyesi)}</span></div>` : ""}
      <div class="satir"><span style="padding-left:10px;color:var(--muted);font-size:12.5px">
        ${gosterTarih(h.tarih)} itibarıyla${gun > 0 ? ` · ${gun} gün önce` : " · bugün"}</span>
        <span></span></div>
      <div class="satir"><span>Aylık faiz</span><span>${h.faizAylik != null ? "%" + h.faizAylik : "bilinmiyor"}</span></div>
      ${h.gecikmeFaizOrani ? `<div class="satir"><span>Gecikme faiz oranı</span><span>%${h.gecikmeFaizOrani}</span></div>` : ""}
      ${limitVar ? `
      <div class="satir"><span>Limit</span><span>${para(h.limit)}</span></div>
      ${h.kalanLimit != null ? `<div class="satir"><span>Kalan limit</span><span>${para(h.kalanLimit)}</span></div>` : ""}` : ""}
      ${h.faizAylik != null ? `
      <div class="satir"><span>Günlük faiz maliyeti</span><span>${para(gunlukFaiz)}</span></div>
      <div class="satir"><span>Ay sonuna kadar (${kalanGun} gün)</span>
        <span>${para(gunlukFaiz * kalanGun)}</span></div>
      <div class="satir"><span style="padding-left:10px;color:var(--muted);font-size:12.5px">
        bakiye sabit kalırsa${h.islemsel ? " · bu hesap işlemsel, sapar" : ""}</span><span></span></div>` : ""}
      ${h.birikmisFaiz != null ? `
      <div class="satir"><span style="color:var(--muted)">↳ kullanılan anapara</span>
        <span style="color:var(--muted)">${para(h.kullanilanAnapara)}</span></div>
      <div class="satir"><span style="color:var(--muted)">↳ birikmiş faiz + vergi</span>
        <span style="color:var(--muted)">${para(h.birikmisFaiz + (h.vergiFon || 0))}</span></div>` : ""}
      ${h.kesimTarihi ? `<div class="satir"><span>Ekstre kesim tarihi</span><span>${gosterTarih(h.kesimTarihi)}</span></div>` : ""}
      ${h.sonOdemeTarihi ? `<div class="satir"><span>Son ödeme tarihi</span><span>${gosterTarih(h.sonOdemeTarihi)}</span></div>` : ""}
      ${e ? `
      <div style="font-size:11.5px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--line)">
        <b>${kacir(e.donem)} ekstresi</b> (${gosterTarih(e.tarih)}): bakiye ${para(e.bakiye)}
        + birikmiş faiz ${para(e.birikmisFaiz)} = toplam borç ${para(e.toplamBorc)}.
        Minimum ödeme ${para(e.minimumOdeme)}, son ödeme ${gosterTarih(e.sonOdemeTarihi)}.
      </div>` : ""}
      <div style="font-size:11.5px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--line)">
        Kaynak: ${kacir(h.kaynak || "—")}
      </div>
    </div>`;
  }).join("")}</div>
  <div class="takvimAlt" style="border:1px solid var(--line);border-radius:var(--radius);
       background:var(--panel);margin-top:10px;display:block">
    <p style="margin:0 0 4px">
      Toplam bilinen KMH/Artı Para borcu: <b style="color:var(--text)">${para(toplamBakiye)}</b> —
      <b>bu tutar yukarıdaki kredi toplamlarına dahil değildir</b>, ayrı bir borç kalemidir.
    </p>
    <p style="margin:6px 0 0">
      Bu bakiyeler günde <b style="color:var(--text)">${para(toplamGunluk)}</b>,
      30 günde <b style="color:var(--text)">${para(toplamGunluk * 30)}</b> faiz üretiyor${
        hesaplar.some(h => h.faizAylik == null && h.bakiye > 0)
          ? " (faiz oranı bilinmeyen hesap hariç)" : ""}.
      Faiz ayın son günü anaparaya eklenir.
    </p>
  </div>`;
}

/* ============================================================
   CARİ — kişi bazlı gelen/giden (banka dökümlerinden)
   ============================================================ */
function cariCiz(){
  const kutu = document.getElementById("cari");
  if(!kutu) return;
  const kisiler = Object.entries(veri.cari || {});
  if(kisiler.length === 0){ kutu.innerHTML = ""; kutu.previousElementSibling.style.display = "none"; return; }
  kutu.previousElementSibling.style.display = "";
  kutu.innerHTML = kisiler.map(([id, c]) => {
    const h = c.hareketler || [];
    const gonderilen = h.filter(x => x.tutar < 0).reduce((s, x) => s - x.tutar, 0);
    const alinan     = h.filter(x => x.tutar > 0).reduce((s, x) => s + x.tutar, 0);
    const net = gonderilen - alinan;
    const bankalar = {};
    for(const x of h){
      const b = bankalar[x.banka] = bankalar[x.banka] || {gon:0, al:0};
      if(x.tutar < 0) b.gon -= x.tutar; else b.al += x.tutar;
    }
    let bakiye = 0;
    const satirlar = h.map(x => { bakiye -= x.tutar; return {...x, bakiye}; }).reverse();
    return `<div class="kredi" style="cursor:default;margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px">
        <b style="font-size:16px">${kacir(c.ad)}</b>
        <span style="font-size:12.5px;color:var(--muted)">${h.length} hareket · ${
          h.length ? gosterTarih(h[0].tarih) + " – " + gosterTarih(h[h.length-1].tarih) : ""}</span>
      </div>
      <div class="ozet" style="margin:12px 0 6px">
        <div class="kart"><div class="etiket">Gönderilen</div><div class="deger">${para0(gonderilen)}</div>
          <div class="alt">${h.filter(x => x.tutar < 0).length} işlem</div></div>
        <div class="kart"><div class="etiket">Geri alınan</div><div class="deger">${para0(alinan)}</div>
          <div class="alt">${h.filter(x => x.tutar > 0).length} işlem</div></div>
        <div class="kart ${net > 0 ? "vurgu-bad" : ""}"><div class="etiket">Net (gönderilen − alınan)</div>
          <div class="deger">${para0(net)}</div>
          <div class="alt">${net > 0 ? "sende alacak görünüyor" : net < 0 ? "fazla alınmış görünüyor" : "denk"}</div></div>
      </div>
      <div style="font-size:12.5px;color:var(--muted);margin-bottom:8px">${Object.entries(bankalar).map(([b, v]) =>
        `${kacir(b)}: gönderilen ${para0(v.gon)} · alınan ${para0(v.al)}`).join(" &nbsp;|&nbsp; ")}</div>
      <details><summary style="cursor:pointer;font-size:13.5px">Tüm hareketler</summary>
        <div class="tabloKutu" style="margin-top:8px"><table>
          <thead><tr><th>Tarih</th><th>Banka</th><th>Açıklama</th>
            <th class="sayi">Giden</th><th class="sayi">Gelen</th><th class="sayi">Net</th></tr></thead>
          <tbody>${satirlar.map(x => `<tr>
            <td>${gosterTarih(x.tarih)}</td><td>${kacir(x.banka)}</td>
            <td style="font-size:12.5px;color:var(--muted)">${kacir(x.aciklama)}</td>
            <td class="sayi">${x.tutar < 0 ? para(-x.tutar) : ""}</td>
            <td class="sayi">${x.tutar > 0 ? para(x.tutar) : ""}</td>
            <td class="sayi"><b>${para(x.bakiye)}</b></td></tr>`).join("")}</tbody>
        </table></div>
      </details>
    </div>`;
  }).join("");
}

function ciz(){
  const kt = document.getElementById("kapamaTarih");
  if(kt && !kt.value) kt.value = metne(bugun());
  ozetCiz();
  yaklasanCiz();
  kredilerCiz();
  kmhCiz();
  cariCiz();
  kapamaCiz();
  izgaraCiz();
  takvimCiz();
}

/* ============================================================
   KREDİ FORMU (ekle / düzenle)
   ============================================================ */
function krediFormu(id){
  const k = id ? veri.krediler.find(x => x.id === id) : null;
  const v = k || {
    banka:"", aciklama:"", anapara:"", faizAylik:"", vade:"",
    ilkTaksit: metne(ayEkle(metne(bugun()), 1)), taksitTutar:""
  };
  // Bankanın planı satır satır girilmişse finansal alanlar plana müdahale etmez — kilitle.
  const ozel = !!(k && Array.isArray(k.ozelPlan) && k.ozelPlan.length);
  const kilit = ozel ? "disabled" : "";

  modalAc(`
    <div class="mbas"><h3>${k ? "Krediyi düzenle" : "Yeni kredi"}</h3></div>
    <div class="mgovde">
      ${ozel ? `<div class="onizleme" style="margin:0 0 16px;border-color:#cfe0ff;background:var(--accent-soft)">
        <b>Bankanın kendi ödeme planı yüklü.</b><br>
        Taksitler bu krediye özel tabloya göre işliyor (eşit olmayan taksitler, fon ve BSMV dahil).
        Aşağıdaki finansal alanlar sadece bilgi amaçlı ve plana etki etmez.
      </div>` : ""}
      <div class="alanlar">
        <div class="alan">
          <label>Banka *</label>
          <input id="f_banka" value="${kacir(v.banka)}" placeholder="Ziraat Bankası">
        </div>
        <div class="alan">
          <label>Açıklama</label>
          <input id="f_aciklama" value="${kacir(v.aciklama)}" placeholder="İşletme kuruluş kredisi">
        </div>
        <div class="alan">
          <label>Kredi tutarı (anapara) *</label>
          <input id="f_anapara" type="number" step="0.01" min="0" value="${v.anapara}" placeholder="500000" ${kilit}>
        </div>
        <div class="alan">
          <label>Aylık faiz oranı (%)</label>
          <input id="f_faiz" type="number" step="0.0001" min="0" value="${v.faizAylik}" placeholder="3.99" ${kilit}>
          <span class="ipucu">Yıllık değil, <b>aylık</b> oran. Faizsizse 0 yaz.</span>
        </div>
        <div class="alan">
          <label>Vade (ay) *</label>
          <input id="f_vade" type="number" step="1" min="1" max="600" value="${v.vade}" placeholder="36" ${kilit}>
        </div>
        <div class="alan">
          <label>İlk taksit tarihi *</label>
          <input id="f_ilk" type="date" value="${v.ilkTaksit}" ${kilit}>
        </div>
        <div class="alan tam">
          <label>Taksit tutarı (isteğe bağlı)</label>
          <input id="f_taksit" type="number" step="0.01" min="0" value="${v.taksitTutar || ""}" placeholder="Boş bırak = faizden hesaplansın" ${kilit}>
          <span class="ipucu">Bankanın ödeme planındaki gerçek taksiti buraya yazarsan o kullanılır.
          Sözleşme taksiti BSMV/KKDF ve masraflar yüzünden saf faiz hesabından farklı çıkar —
          <b>gerçek rakamı girmek her zaman daha doğrudur.</b></span>
        </div>
      </div>
      <div class="onizleme" id="onizleme"></div>
      <div class="hata" id="formHata"></div>
    </div>
    <div class="malt">
      ${k ? `<button class="danger" onclick="krediSil('${k.id}')">Krediyi sil</button><div style="flex:1"></div>` : ""}
      <button onclick="modalKapat()">Vazgeç</button>
      <button class="primary" onclick="krediKaydet(${k ? "'"+k.id+"'" : "null"})">${k ? "Kaydet" : "Ekle"}</button>
    </div>
  `);

  ["f_anapara","f_faiz","f_vade","f_taksit"].forEach(x =>
    document.getElementById(x).addEventListener("input", onizle));
  onizle();
  document.getElementById("f_banka").focus();
}

function onizle(){
  const anapara = parseFloat(document.getElementById("f_anapara").value) || 0;
  const faiz    = parseFloat(document.getElementById("f_faiz").value) || 0;
  const vade    = parseInt(document.getElementById("f_vade").value) || 0;
  const elle    = parseFloat(document.getElementById("f_taksit").value) || 0;
  const kutu    = document.getElementById("onizleme");

  if(anapara <= 0 || vade <= 0){
    kutu.innerHTML = `<span style="color:var(--muted)">Tutar ve vadeyi gir, taksit tablosunu burada göstereyim.</span>`;
    return;
  }
  const hesap  = taksitHesapla(anapara, faiz, vade);
  const taksit = elle > 0 ? elle : hesap;
  const toplam = taksit * vade;

  kutu.innerHTML = `
    <div class="sat"><span>Aylık taksit</span><b>${para(taksit)}</b></div>
    <div class="sat"><span>Toplam geri ödeme</span><b>${para(toplam)}</b></div>
    <div class="sat"><span>Toplam faiz / maliyet</span><b>${para(toplam - anapara)}</b></div>
    ${elle > 0 && Math.abs(elle - hesap) > 1
      ? `<div class="sat" style="color:var(--muted);font-size:12px;padding-top:6px">
           Faiz oranından hesaplanan taksit ${para(hesap)} — girdiğin tutar kullanılacak.
         </div>` : ""}`;
}

function krediKaydet(id){
  const al = x => document.getElementById(x).value.trim();
  const banka  = al("f_banka");
  const anapara= parseFloat(al("f_anapara"));
  const faiz   = parseFloat(al("f_faiz")) || 0;
  const vade   = parseInt(al("f_vade"));
  const ilk    = al("f_ilk");
  const elle   = parseFloat(al("f_taksit"));
  const hata   = document.getElementById("formHata");

  if(!banka)                    return hata.textContent = "Banka adı boş olamaz.";
  if(!(anapara > 0))            return hata.textContent = "Kredi tutarı 0'dan büyük olmalı.";
  if(!(vade >= 1 && vade <= 600))return hata.textContent = "Vade 1–600 ay arasında olmalı.";
  if(!ilk)                      return hata.textContent = "İlk taksit tarihi seçilmeli.";
  if(faiz < 0)                  return hata.textContent = "Faiz oranı negatif olamaz.";

  const taksitTutar = elle > 0 ? elle : null;
  // Taksit faizi bile karşılamıyorsa borç hiç kapanmaz — baştan engelle
  if(taksitTutar && faiz > 0 && taksitTutar <= anapara * faiz / 100){
    return hata.textContent = "Girdiğin taksit aylık faizi bile karşılamıyor; borç bu planla kapanmaz. Taksiti veya faiz oranını kontrol et.";
  }

  if(id){
    const k = veri.krediler.find(x => x.id === id);
    Object.assign(k, {
      banka, aciklama: al("f_aciklama"), anapara,
      faizAylik: faiz, vade, ilkTaksit: ilk, taksitTutar
    });
  }else{
    veri.krediler.push({
      id: yeniId(), banka, aciklama: al("f_aciklama"), anapara,
      faizAylik: faiz, vade, ilkTaksit: ilk, taksitTutar, odemeler: {}
    });
  }
  kaydet();
  modalKapat();
  ciz();
}

function krediSil(id){
  const k = veri.krediler.find(x => x.id === id);
  if(!k) return;
  if(!confirm(`"${k.banka}" kredisi ve tüm ödeme kayıtları silinecek.\n\nBu geri alınamaz. Emin misin?`)) return;
  veri.krediler = veri.krediler.filter(x => x.id !== id);
  kaydet();
  modalKapat();
  ciz();
}

/* ============================================================
   KREDİ DETAYI — ödeme planı
   ============================================================ */
function detayAc(id){
  const k = veri.krediler.find(x => x.id === id);
  if(!k) return;
  const o = krediOzet(k);
  const bg = bugun();
  const vergiVar = o.plan.some(t => (t.fon || 0) + (t.vergi || 0) > 0);

  modalAc(`
    <div class="mbas">
      <div>
        <h3>${kacir(k.banka)}</h3>
        ${k.aciklama ? `<div style="font-size:13px;color:var(--muted)">${kacir(k.aciklama)}</div>` : ""}
      </div>
      <div style="flex:1"></div>
      <button onclick="krediFormu('${k.id}')">Düzenle</button>
      <button class="ghost" onclick="modalKapat()">Kapat</button>
    </div>
    <div class="mgovde">
      <div class="detayUst">
        <div class="k"><div class="e">Anapara</div><div class="d">${para0(k.anapara)}</div></div>
        <div class="k"><div class="e">Aylık faiz</div><div class="d">%${k.faizAylik || 0}</div></div>
        <div class="k"><div class="e">Toplam geri ödeme</div><div class="d">${para0(o.toplamGeriOdeme)}</div></div>
        <div class="k"><div class="e">Toplam maliyet</div><div class="d">${para0(o.toplamMaliyet)}</div></div>
        <div class="k"><div class="e">Maliyet oranı</div><div class="d">%${k.anapara > 0
          ? Math.round(o.toplamMaliyet / k.anapara * 100) : 0}</div></div>
        <div class="k"><div class="e">Kalan borç</div><div class="d">${para0(o.kalanBorc)}</div></div>
        <div class="k"><div class="e">— anaparası</div><div class="d">${para0(o.kalanAnaparaBorc)}</div></div>
        <div class="k"><div class="e">— faiz + vergi</div><div class="d">${para0(o.kalanMaliyet)}</div></div>
        <div class="k"><div class="e">Ödenen</div><div class="d">${para0(o.odenen)}</div></div>
        <div class="k"><div class="e">Taksit</div><div class="d">${o.odenenAdet}/${o.taksitSayisi}</div></div>
        <div class="k"><div class="e">İlk vade</div><div class="d" style="font-size:14px">${gosterTarih(o.plan[0].vade)}</div></div>
        <div class="k"><div class="e">Son vade</div><div class="d" style="font-size:14px">${gosterTarih(o.plan[o.plan.length-1].vade)}</div></div>
      </div>

      ${Array.isArray(k.bilgiler) && k.bilgiler.length ? `
      <h2 class="baslik" style="margin-top:0">Banka bilgileri</h2>
      <div class="bilgiler">
        ${k.bilgiler.map(([e, d]) => `<div class="b">
          <div class="e">${kacir(e)}</div><div>${kacir(d)}</div>
        </div>`).join("")}
      </div>` : ""}

      <h2 class="baslik">Ödeme planı</h2>
      <div class="tabloKutu">
        <table>
          <thead><tr>
            <th style="width:46px">Ödendi</th>
            <th>#</th><th>Vade</th>
            <th class="sayi">Taksit</th>
            <th class="sayi">Anapara</th>
            <th class="sayi">Faiz</th>
            ${vergiVar ? `<th class="sayi">Fon + BSMV</th>` : ""}
            <th class="sayi">Kalan anapara</th>
            <th>Durum</th>
          </tr></thead>
          <tbody>${o.plan.map(t => {
            const fark = gunFarki(t.odemeVade, bg);
            const gecikmis = !t.odendi && fark < 0;
            let durum;
            if(t.odendi)        durum = `<span class="rozet ok">${gosterTarih(t.odemeTarihi)}</span>`;
            else if(gecikmis)   durum = `<span class="rozet bad">${-fark} gün gecikti</span>`;
            else if(fark <= 7)  durum = `<span class="rozet warn">${fark} gün kaldı</span>`;
            else                durum = "";
            if(t.devir) durum += `<div style="font-size:11.5px;color:var(--muted);margin-top:3px">${para(t.devir.tutar)} → ${t.devir.hedef}. taksite devredildi</div>`;
            if(t.tahmini) durum += `<div style="font-size:11.5px;color:var(--warn);margin-top:3px">⚠ ${kacir(t.tahmini)}</div>`;
            if(t.devirGelen) durum += `<div style="font-size:11.5px;color:var(--muted);margin-top:3px">${t.devirGelen.kaynak}. taksitten ${para(t.devirGelen.tutar)} devir dahil</div>`;
            if(t.kismi) durum += `<div style="font-size:11.5px;color:var(--muted);margin-top:3px">${
              t.kismiListe.map(x => `${gosterTarih(x.tarih)}: ${para(x.tutar)} ödendi`).join("<br>")}<br><b>kalan ${para(t.kalan)}</b></div>`;
            return `<tr class="${t.odendi ? "odendi" : ""} ${gecikmis ? "gecikmis" : ""} ${o.siradaki && o.siradaki.no === t.no ? "siradaki" : ""}">
              <td>${t.odendi
                    ? `<span style="color:var(--ok);font-weight:700" title="Ödendi">✓</span>`
                    : `<span style="color:var(--muted)">—</span>`}</td>
              <td>${t.no}</td>
              <td>${gosterTarih(t.vade)}${haftaSonu(t.vade)
                    ? `<div style="font-size:11.5px;color:var(--muted)">→ ${gosterTarih(t.odemeVade)}</div>` : ""}</td>
              <td class="sayi"><b>${para(t.tutar)}</b></td>
              <td class="sayi">${para(t.anapara)}</td>
              <td class="sayi">${para(t.faiz)}</td>
              ${vergiVar ? `<td class="sayi">${para((t.fon || 0) + (t.vergi || 0))}</td>` : ""}
              <td class="sayi">${para(t.kalanAnapara)}</td>
              <td>${durum}</td>
            </tr>`;
          }).join("")}</tbody>
        </table>
      </div>
    </div>
  `, true);
}

    `<div class="perde" onclick="if(event.target===this) modalKapat()">
       <div class="modal ${genis ? "genis" : ""}" id="detayModal">${icerik}</div>
     </div>`;
}
function modalKapat(){
  document.getElementById("modalYuva").innerHTML = "";
}
document.addEventListener("keydown", e => { if(e.key === "Escape") modalKapat(); });

temaDugmeGuncelle();
</script>

<script>
// Veri AES-GCM ile şifreli; anahtar paroladan PBKDF2 ile türetilir.
(function(){
  "use strict";
  const meta = JSON.parse(document.getElementById("sifreliVeri").textContent);

  function b64ToBuf(b64){
    const ikili = atob(b64);
    const buf = new Uint8Array(ikili.length);
    for(let i = 0; i < ikili.length; i++) buf[i] = ikili.charCodeAt(i);
    return buf;
  }
  async function anahtarTuret(parola, tuz){
    const temel = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(parola), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name:"PBKDF2", salt:tuz, iterations:250000, hash:"SHA-256" },
      temel, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  }

  window.parolaDene = async function(){
    const girdi = document.getElementById("parolaGirdi");
    const hataEl = document.getElementById("parolaHata");
    const dugme = document.getElementById("parolaDugme");
    if(!girdi.value){ hataEl.textContent = "Parola gir."; return; }
    hataEl.textContent = "";
    dugme.disabled = true; dugme.textContent = "Kontrol ediliyor…";
    try{
      const anahtar = await anahtarTuret(girdi.value, b64ToBuf(meta.tuz));
      const cozulmus = await crypto.subtle.decrypt(
        { name:"AES-GCM", iv: b64ToBuf(meta.iv) }, anahtar, b64ToBuf(meta.veri));
      window.__cozulmusVeriMetni = new TextDecoder().decode(cozulmus);
      veri = yukle();
      document.getElementById("parolaEkrani").style.display = "none";
      document.getElementById("uygulamaIcerik").style.display = "";
      ciz();
    }catch(e){
      hataEl.textContent = "Yanlış parola.";
    }finally{
      dugme.disabled = false; dugme.textContent = "Görüntüle";
    }
  };

  document.getElementById("parolaGirdi").addEventListener("keydown", e => {
    if(e.key === "Enter") window.parolaDene();
  });
  document.getElementById("parolaGirdi").focus();
})();
</script>
