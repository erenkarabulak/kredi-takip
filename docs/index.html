<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Borç Takip</title>
<style>
  :root{--bg:#0a0a0b;--bg2:#111113;--bg3:#1b1b1f;--ink:#ededef;--muted:#8b8b95;--line:rgba(255,255,255,.09);
    --vurgu:#ededef;--vurgu-ink:#0a0a0b;--kirmizi:#ff6369;--ease:cubic-bezier(.23,1,.32,1);color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);
    font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .kutu{position:relative;width:min(380px,100%);background:var(--bg2);border:1px solid var(--line);border-radius:14px;
    padding:26px 24px 22px;box-shadow:0 18px 48px rgba(0,0,0,.55);animation:gir .5s var(--ease) both}
  @keyframes gir{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#ededef 50%,#f5a340 50%);margin-bottom:14px}
  h1{margin:0;font-size:18px;letter-spacing:-.2px}
  p{margin:4px 0 18px;color:var(--muted);font-size:12.5px}
  .gizli{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}
  label{display:block;color:var(--muted);font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;margin-bottom:6px}
  input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg3);
    color:var(--ink);font:inherit;letter-spacing:.14em}
  input:focus{outline:2px solid var(--vurgu);outline-offset:1px;border-color:transparent}
  button{width:100%;margin-top:10px;padding:11px 12px;border:0;border-radius:9px;background:var(--vurgu);
    color:var(--vurgu-ink);font:inherit;font-weight:700;cursor:pointer;transition:opacity 150ms ease,transform 160ms var(--ease)}
  button:disabled{opacity:.5;cursor:default}
  button:active{transform:scale(.97)}
  .uyari{min-height:18px;margin-top:10px;color:var(--kirmizi);font-size:12px}
  .dip{margin:16px 0 0;font-size:10.5px;color:var(--muted);opacity:.75}
</style>
</head>
<body>
<form class="kutu" id="form" method="post" action="#">
  <div class="logo" aria-hidden="true"></div>
  <h1>Borç Takip</h1>
  <p>Bu sayfanın içeriği şifrelidir. Görmek için parolayı gir.</p>
  <!-- Parola yöneticileri (Safari/iCloud Anahtar Zinciri, Chrome) kaydı kullanıcı adı + parola çifti olarak tutar;
       görünmeyen sabit kullanıcı adı bu yüzden var. display:none olursa Safari onu yok sayar, o yüzden yalnızca görsel gizli. -->
  <input class="gizli" type="text" name="username" id="kullanici" value="Borç Takip" autocomplete="username" readonly tabindex="-1" aria-hidden="true">
  <label for="p">Parola</label>
  <input id="p" name="password" type="password" autocomplete="current-password" autofocus required>
  <button id="g" type="submit">Aç</button>
  <div class="uyari" id="uyari" role="alert"></div>
  <p class="dip">AES-256-GCM · PBKDF2 600.000 tur · çözme tarayıcıda yapılır</p>
</form>

<script>
const al = id => document.getElementById(id).textContent.trim();
const bin = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
form.addEventListener("submit", async e => {
  e.preventDefault();
  const parola = p.value;
  if (!parola) return;
  g.disabled = true; g.textContent = "Açılıyor…"; uyari.textContent = "";
  try {
    const ham = await crypto.subtle.importKey("raw", new TextEncoder().encode(parola), "PBKDF2", false, ["deriveKey"]);
    const anahtar = await crypto.subtle.deriveKey(
      {name:"PBKDF2", salt:bin(al("tuz")), iterations:600000, hash:"SHA-256"}, ham,
      {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const acik = await crypto.subtle.decrypt({name:"AES-GCM", iv:bin(al("iv"))}, anahtar, bin(al("veri")));
    const html = new TextDecoder().decode(acik);
    /* Parola doğru: tarayıcıya "giriş başarılı" sinyali ver ki parolayı kaydetmeyi önersin.
       Chrome/Edge için Credential Management API; Safari formun gönderilip sayfadan kalkmasını görünce önerir. */
    try { if (window.PasswordCredential) await navigator.credentials.store(new PasswordCredential({id:"Borç Takip", password:parola, name:"Borç Takip"})) } catch (_) {}
    document.open(); document.write(html); document.close();
  } catch (hata) {
    uyari.textContent = "Parola yanlış.";
    g.disabled = false; g.textContent = "Aç";
    p.select();
  }
});
</script>
